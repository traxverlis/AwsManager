# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore tests/AwsManager.Tests/AwsManager.Tests.csproj
      - name: Build
        run: dotnet build tests/AwsManager.Tests/AwsManager.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/AwsManager.Tests/AwsManager.Tests.csproj -c Release --no-build --filter "TestCategory!=LiveReadOnly" --logger trx --results-directory TestResults
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 3
      - name: Publish portable Windows application
        run: dotnet publish AwsManager.csproj -c Release -r win-x64 --self-contained true -o artifacts/AwsManager
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: AwsManager-win-x64
          path: artifacts/AwsManager
          if-no-files-found: error
          retention-days: 3
